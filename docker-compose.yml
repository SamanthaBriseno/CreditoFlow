services:
  postgres:
    image: postgres:15-alpine
    container_name: creditoflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - creditoflow

  n8n:
    build:
      context: .
      dockerfile: Dockerfile.n8n
    image: creditoflow-n8n:latest
    container_name: creditoflow-n8n
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8n123
      N8N_BASIC_AUTH_ACTIVE: "false"
      WEBHOOK_URL: http://localhost:8018
      N8N_COMMUNITY_PACKAGES_ENABLED: "true"
    ports:
      - "8018:5678"
    depends_on:
      - postgres
    networks:
      - creditoflow

  app:
    build: .
    container_name: creditoflow-app
    restart: unless-stopped
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: n8n
      PG_USER: n8n
      PG_PASSWORD: n8n123
      N8N_URL: http://n8n:5678
      PORT: 3000
    ports:
      - "8020:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - postgres
      - n8n
    networks:
      - creditoflow

volumes:
  postgres_data:
  uploads_data:

networks:
  creditoflow:
    driver: bridge
